<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Recepten — Chef Lil J</title>
  <meta name="description" content="Chef Lil J's persoonlijke receptenverzameling" />
  <link rel="icon" type="image/png" href="/recepten/assets/logo.PNG">
  <link rel="apple-touch-icon" href="/recepten/assets/logo.PNG">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Reenie+Beanie&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/base.css?v=20261009-6">
  <link rel="stylesheet" href="assets/css/home.css?v=20261009-6">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="../" aria-label="Terug naar Chef Lil J">
      <img src="assets/logo.PNG" alt="Chef Lil J" width="64" height="64" decoding="async">
    </a>
    <h1>Recepten</h1>
    <p class="muted">Wat maakte ik ook alweer?</p>
  </header>

  <main>
    <section class="controls" aria-label="Zoeken en filters">
      <div class="search-wrap">
        <input type="search" id="searchInput" class="search-input" placeholder="Zoek recept of ingrediënt…" aria-label="Zoek recept of ingrediënt" />
      </div>

      <div class="filter-row">
        <div class="ms" id="f-ingredient" data-label="Ingrediënten"></div>
        <div class="ms" id="f-type" data-label="Type"></div>
        <div class="ms" id="f-dieet" data-label="Dieet"></div>
      </div>

      <div class="filters-footer">
        <span id="resultCount" class="result-count" aria-live="polite"></span>
        <button id="clearFilters" class="clear-btn" type="button">Wis filters</button>
      </div>
    </section>

    <section class="grid-wrap">
      <div id="emptyState" class="empty">Geen recepten gevonden. Pas je filters aan of wis de zoekopdracht.</div>
      <div id="grid" class="grid" aria-live="polite"></div>
    </section>
  </main>

  <script src="assets/data/recipes.js?v=20261009-8"></script>
  <script src="assets/js/app.js?v=20261007-1"></script>
</body>
</html>
